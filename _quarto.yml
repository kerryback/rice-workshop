project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - slides/*.qmd
  resources:
    - .nojekyll
    - CNAME
    # At the site root, so the browser's implicit /favicon.ico request is
    # satisfied for the decks under /slides/ as well as for index.
    - favicon.ico
    - announcement.pdf
    - pdf/*.pdf
    - slides/*.html
    - housing_affordability.pptx
    # At the site root so the URL stays short and survives the session it was
    # built in: /regression.html.
    - regression.html
    # Research note behind the HBS slide in deck 4, published at /hbs.html so
    # it can be linked from the deck and shared on its own.
    - hbs.html
    # Two artifacts from the "multiples" research project, copied from that
    # repo as course examples of how a multi-author AI-assisted project is run
    # and reported on. Published at /protocols.html and /status-2026-08-15.html.
    # They are snapshots -- re-copy from ~/repos/multiples to refresh.
    - protocols.html
    - status-2026-08-15.html
    - files/session1/*
    - files/session1.zip
    - files/session2/SamplePresentation.pptx
    - files/session2/tesla1.pptx
    - files/session2/tesla2.pptx
    - files/session2.zip
    # Only the sample deck is published. course_roster.pdf is a real ESTHER
    # roster with student names and photos -- it stays local and is handed out
    # in the Zoom chat, never copied into docs/. Do not widen this to a glob.
    - files/session4/slide_rule.pdf
    # Played from deck 7. 7.5 MB, so it is listed explicitly rather than
    # globbed -- the roster PDF beside it must never be published.
    - files/session4/slide_rule.mp4
    # Built by hand with course_roster.pdf and .voiceover/ excluded. Re-zip it
    # the same way, or the roster ships to the class.
    - files/session4.zip
    - under-construction.html

website:
  title: ""
  search: false
  favicon: favicon.ico

format:
  html:
    theme:
      light: flatly
      dark: superhero
    link-external-newwindow: true
