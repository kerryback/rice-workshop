project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - slides/*.qmd
  resources:
    - .nojekyll
    - CNAME
    # At the site root, so the browser's implicit /favicon.ico request is
    # satisfied for the decks under /slides/ as well as for index.
    - favicon.ico
    - announcement.pdf
    - pdf/*.pdf
    - slides/*.html
    - housing_affordability.pptx
    - files/session1/*
    - files/session1.zip
    - files/session2/SamplePresentation.pptx
    - files/session2/tesla1.pptx
    - files/session2/tesla2.pptx
    - files/session2.zip
    - under-construction.html

website:
  title: ""
  search: false
  favicon: favicon.ico

format:
  html:
    theme:
      light: flatly
      dark: superhero
    link-external-newwindow: true
